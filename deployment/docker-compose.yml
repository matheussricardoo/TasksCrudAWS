# Local API/MySQL only: docker compose -f deployment/docker-compose.yml up --build -d
services:
  mysql:
    image: mysql:8.0
    container_name: tasks-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tasks_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: senha123
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-psenha123"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: tasks-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: mysql
      DB_USER: admin
      DB_PASSWORD: senha123
      DB_NAME: tasks_db
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
